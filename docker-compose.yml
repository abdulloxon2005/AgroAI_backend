version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroai_backend
    restart: always
    env_file:
      - .env.production
    volumes:
      - agroai_uploads:/app/uploads
      - agroai_db_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: agroai_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - agroai_uploads:/app/uploads:ro
    depends_on:
      - backend

volumes:
  agroai_uploads:
  agroai_db_data:
